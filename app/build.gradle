apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'


import org.jetbrains.kotlin.gradle.dsl.JvmTarget

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86":3, "x86_64":4]
ext.universalBase = 8000

android {
    namespace  = 'com.aaronmaxlab.maxplayer'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.aaronmaxlab.maxplayer"
        minSdk = 23
        targetSdk = 36

        versionCode = 24
        versionName = "3.4"

        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters  "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    flavorDimensions "default"
    productFlavors {
        "default" {
            isDefault true
        }
        api29 {
            targetSdkVersion 29
            versionNameSuffix "-oldapi"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose true
    }

    splits {
        abi {
            enable false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // https://youtrack.jetbrains.com/issue/KT-55947
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_11)
        }
    }

}


import com.android.build.OutputFile

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def abi = output.getFilter(OutputFile.ABI)
        def base = project.ext.abiCodes.get(abi)
        if (base != null) {
            output.versionCodeOverride = base * 1000 + variant.versionCode
        } else {
            output.versionCodeOverride = universalBase + variant.versionCode
        }
    }
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "com.google.android.material:material:1.14.0"
    implementation "com.github.bumptech.glide:glide:5.0.9"
    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'


}
